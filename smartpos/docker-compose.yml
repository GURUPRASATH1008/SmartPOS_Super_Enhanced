services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - smartpos-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/smartpos
      JWT_SECRET: ${JWT_SECRET:-change-this-local-demo-secret-before-deployment}
      CLIENT_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    ports:
      - "8080:80"
volumes:
  smartpos-mongo:
